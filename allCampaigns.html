<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Campaigns | GiftBloom</title>
    <link rel="stylesheet" href="allCampaigns.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="logo">💝 GiftBloom</div>
        
        <div id="menuBtn" class="menu-btn">☰</div>
        
        <ul id="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="allCampaigns.html">Campaigns</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a class="signup" href="signup.html">Sign Up</a></li>
        </ul>
    </nav>
</header>
<section class="manage-section">
    <button class="back-btn" onclick="history.back()">← Back</button>

    <div class="title">
        <h2>📊 All Campaigns</h2>
        <p>View All Campaigns Together, and Choose To Support Your Favourite</p>
    </div>

    <div class="controls-bar">
        <div class="filter-tabs">
            <button class="tab-btn active" id="tab-Active" onclick="changeTab('Active')">🟢 Live</button>
            <button class="tab-btn" id="tab-Completed" onclick="changeTab('Completed')">🎉 Completed</button>
            <button class="tab-btn" id="tab-Blocked" onclick="changeTab('Blocked')">🚫 Blocked</button>
        </div>

        <select id="campaignSort" onchange="renderCampaigns()">
            </select>
    </div>

    <div class="campaigns-grid" id="campaignList">
        </div>
</section>

<script src="allCampaigns.js"></script>
</body>
</html>
