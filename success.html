<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campaign Published | GiftBloom</title>

<link rel="stylesheet" href="success.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="hearts"></div>

<section class="success-page">

<div class="glass success-card">

<div class="success-icon">

🎉

</div>

<h1>

Campaign Published Successfully!

</h1>

<p>

Your campaign is now live and ready to receive support.

</p>

<!-- Campaign Summary -->

<div class="summary">

<img
id="giftImage"
src=""
alt="Gift">

<h2 id="giftName">

Loading...

</h2>

<p>

❤️ For

<span id="receiver">

Loading...

</span>

</p>

</div>

<!-- Campaign ID -->

<div class="campaign-id">

Campaign ID

<h3 id="campaignId">

GB000001

</h3>

</div>

<!-- Share Link -->

<div class="share-box">

<input
type="text"
id="campaignLink"
readonly>

<button
id="copyBtn">

📋 Copy

</button>

</div>

<!-- Buttons -->

<div class="buttons">

<button
id="viewBtn"
class="primary">

👀 View Campaign

</button>

<button
id="shareBtn"
class="secondary">

📤 Share Campaign

</button>

<button
id="dashboardBtn"
class="secondary">

📊 Dashboard

</button>

<button
id="homeBtn"
class="secondary">

🏠 Home

</button>

</div>

</div>

</section>

<script src="success.js"></script>

</body>

</html>
